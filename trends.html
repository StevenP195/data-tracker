<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Data Tracker · Trends</title>
  <meta name="description" content="A report on the tracker's history: market scoreboard, TXSE leaders, analyst upside, volatility and estimate revisions.">
  <meta name="theme-color" content="#0b2a4a">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="assets/icons/icon-192.png">
  <link rel="apple-touch-icon" href="assets/icons/icon-192.png">
  <link rel="stylesheet" href="assets/style.css">
</head>
<body>
  <header id="nav"></header>
  <main>
    <div class="page-head">
      <h1>Trends</h1>
      <p id="span">Every number on this page is computed in your browser from data/history.csv.</p>
    </div>

    <section class="card">
      <h2>Explore any value over time</h2>
      <div class="controls">
        <label>Value<select id="x-col"></select></label>
        <label>Show as<select id="x-mode"><option value="raw">Actual values</option><option value="rebased">Rebased to 100 at first day</option></select></label>
        <label>Find items<input type="search" id="x-q" placeholder="filter the list" autocomplete="off"></label>
        <button class="btn" data-pick="Index">Indexes</button>
        <button class="btn" data-pick="TXSE">TXSE</button>
        <button class="btn" data-pick="stars">★ Shortlist</button>
        <button class="btn" data-pick="none">Clear</button>
      </div>
      <div class="picker" id="x-items"></div>
      <div class="chart-box"><canvas id="x-chart"></canvas></div>
    </section>

    <div id="findings"></div>
  </main>
  <script src="assets/vendor/chart.umd.min.js"></script>
  <script src="assets/app.js"></script>
  <script src="assets/trends.js"></script>
</body>
</html>
