<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Data Tracker · Trends</title>
  <meta name="description" content="A report on the tracker's history: market scoreboard, TXSE leaders, analyst upside, volatility and estimate revisions.">
  <meta name="theme-color" content="#0d366b">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="assets/icons/icon-192.png">
  <link rel="apple-touch-icon" href="assets/icons/icon-192.png">
  <link rel="preload" href="assets/fonts/Inter-400-700.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="assets/fonts/SourceSerif4-400-700.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="assets/style.css">
</head>
<body>
  <header id="nav"></header>
  <main>
    <div class="page-head compact">
      <h1>Trends</h1>
      <div class="meta-line" id="span">Computed in your browser from data/history.csv</div>
    </div>

    <section class="panel">
      <div class="toolbar">
        <span class="panel-label">Chart</span>
        <select id="x-col" aria-label="Value"></select>
        <div class="seg" id="x-mode" role="group" aria-label="Scale">
          <button data-mode="rebased" title="Each item's first value = 100">Rebased</button>
          <button data-mode="raw">Actual</button>
        </div>
        <span class="spacer"></span>
        <div class="seg" role="group" aria-label="Presets">
          <button data-pick="Index">Indexes</button>
          <button data-pick="TXSE">TXSE</button>
          <button data-pick="stars">★ Shortlist</button>
          <button data-pick="none">Clear</button>
        </div>
      </div>
      <div class="series-bar" id="x-series"></div>
      <div class="panel-body"><div class="chart-lg"><canvas id="x-chart"></canvas></div></div>
    </section>

    <div class="panel-grid" id="findings"></div>
  </main>
  <footer>Prices: TXSE official feed and Yahoo Finance · Earnings and analyst data: Nasdaq and Yahoo Finance · Short interest: TXSE.
    Built for a Financial Data Analytics course project. Not investment advice.</footer>
  <script src="assets/vendor/chart.umd.min.js"></script>
  <script src="assets/app.js"></script>
  <script src="assets/trends.js"></script>
</body>
</html>
