name: Daily data run

on:
  schedule:
    - cron: "23 4 * * *"   # 04:23 UTC every day, after TXSE posts closing prices (~02:00 UTC)
  workflow_dispatch: {}     # "Run workflow" button for a manual run

permissions:
  contents: write   # commit raw files, history and status
  issues: write     # open today's issue, close yesterday's
  pages: write
  id-token: write

concurrency:
  group: daily-data-run
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v5
      - name: Install
        run: uv sync
      - name: Fetch sources, build history and status, open the daily issue
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: uv run python -m tracker run
      - name: Commit data
        run: |
          git config user.name "data-tracker[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/raw data/runs data/history.csv data/status.json
          git commit -m "Daily run $(date -u +%F)" || echo "nothing to commit"
          for i in 1 2 3; do git pull --rebase origin main && git push origin HEAD:main && break; sleep 5; done

  deploy:
    needs: run
    uses: ./.github/workflows/pages.yml
    permissions:
      contents: read
      pages: write
      id-token: write
